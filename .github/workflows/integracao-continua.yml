name: Integração contínua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.sistema }})
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sistema: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar .NET SDK 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore GestaoTarefas.slnx

      - name: Compilar em Release
        run: dotnet build GestaoTarefas.slnx --configuration Release --no-restore

      - name: Executar testes unitários e de integração
        run: dotnet test GestaoTarefas.slnx --configuration Release --no-build --no-restore --logger trx --results-directory TestResults --blame-hang-timeout 2m

      - name: Preservar resultados dos testes
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: testes-backend-${{ matrix.sistema }}
          path: backend/TestResults/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do lockfile
        run: npm ci

      - name: Executar testes com Vitest sem watch
        run: npm test

      - name: Compilar em produção
        run: npm run build

      - name: Verificar vulnerabilidades altas e críticas
        run: npm audit --audit-level=high

  compose:
    name: Docker Compose e persistência
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: ${{ github.workspace }}/docker-compose.yml
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validar Docker Engine e configuração do Compose
        run: |
          echo "DIRETORIO_DIAGNOSTICOS=$RUNNER_TEMP/diagnosticos-compose" >> "$GITHUB_ENV"
          docker info
          docker compose version
          docker compose config --quiet

      - name: Construir imagens da API e do frontend
        run: docker compose build api frontend

      - name: Inicializar containers e aguardar healthchecks
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Validar HTTP, cadastro e persistência pelo Nginx
        run: |
          mkdir -p "$DIRETORIO_DIAGNOSTICOS"
          cd "$DIRETORIO_DIAGNOSTICOS"

          docker compose port frontend 8080 | tee porta-frontend.txt
          test "$(cat porta-frontend.txt)" = "127.0.0.1:8080"

          for servico in api frontend; do
            container=$(docker compose ps --quiet "$servico")
            test -n "$container"
            test "$(docker inspect --format '{{.State.Health.Status}}' "$container")" = healthy
          done

          codigo=$(curl --fail-with-body --silent --show-error --max-time 15 \
            http://127.0.0.1:8080/ --output frontend.html --write-out '%{http_code}')
          test "$codigo" = 200
          grep --quiet '<app-raiz>' frontend.html

          codigo=$(curl --fail-with-body --silent --show-error --max-time 15 \
            http://127.0.0.1:8080/api/tarefas --output tarefas.json --write-out '%{http_code}')
          test "$codigo" = 200
          jq --exit-status 'type == "array"' tarefas.json

          titulo="Tarefa CI $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          jq --null-input --arg titulo "$titulo" \
            '{titulo: $titulo, descricao: "Verificar persistência pelo Nginx", dataVencimento: "2030-12-31"}' \
            > requisicao.json
          codigo=$(curl --silent --show-error --max-time 15 \
            --header 'Content-Type: application/json' --data-binary @requisicao.json \
            --output criada.json --write-out '%{http_code}' http://127.0.0.1:8080/api/tarefas)
          test "$codigo" = 201
          jq --exit-status --arg titulo "$titulo" \
            '.titulo == $titulo and .descricao == "Verificar persistência pelo Nginx" and
             .situacao == "Pendente" and .dataVencimento == "2030-12-31" and
             (.id | test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$")) and
             .id != "00000000-0000-0000-0000-000000000000"' criada.json
          id=$(jq --raw-output '.id' criada.json)

          curl --fail-with-body --silent --show-error --max-time 15 \
            "http://127.0.0.1:8080/api/tarefas/$id" --output consultada.json
          jq --exit-status --slurp '.[0] == .[1]' criada.json consultada.json

          container_anterior=$(docker compose ps --quiet api)
          docker compose up \
            --detach --no-deps --force-recreate --wait --wait-timeout 180 api
          container_atual=$(docker compose ps --quiet api)
          test -n "$container_atual"
          test "$container_anterior" != "$container_atual"

          # O Nginx pode aguardar a expiração do cache DNS após a troca do container.
          curl --fail-with-body --silent --show-error --max-time 10 \
            --retry 12 --retry-delay 2 --retry-max-time 60 --retry-all-errors \
            "http://127.0.0.1:8080/api/tarefas/$id" --output persistida.json
          jq --exit-status --slurp '.[0] == .[1]' criada.json persistida.json

      - name: Coletar diagnósticos em caso de falha
        if: ${{ failure() }}
        run: |
          mkdir -p "$DIRETORIO_DIAGNOSTICOS"
          docker compose ps --all > "$DIRETORIO_DIAGNOSTICOS/containers.txt" 2>&1 || true
          docker compose port frontend 8080 > "$DIRETORIO_DIAGNOSTICOS/portas.txt" 2>&1 || true
          docker network ls --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME" \
            > "$DIRETORIO_DIAGNOSTICOS/redes.txt" 2>&1 || true
          for rede in $(docker network ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME"); do
            docker network inspect "$rede" >> "$DIRETORIO_DIAGNOSTICOS/redes.txt" 2>&1 || true
          done
          docker compose logs --no-color --timestamps > "$DIRETORIO_DIAGNOSTICOS/compose.log" 2>&1 || true
          for container in $(docker compose ps --all --quiet); do
            docker inspect "$container" > "$DIRETORIO_DIAGNOSTICOS/$container.json" 2>&1 || true
          done
          cat "$DIRETORIO_DIAGNOSTICOS/containers.txt" "$DIRETORIO_DIAGNOSTICOS/portas.txt" \
            "$DIRETORIO_DIAGNOSTICOS/redes.txt" "$DIRETORIO_DIAGNOSTICOS/compose.log"

      - name: Preservar diagnósticos do Compose
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: diagnosticos-compose
          path: ${{ env.DIRETORIO_DIAGNOSTICOS }}/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remover recursos isolados da execução da CI
        if: ${{ always() }}
        run: |
          test "$GITHUB_ACTIONS" = true
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$COMPOSE_PROJECT_NAME" = "ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker compose down --volumes --remove-orphans --timeout 30
